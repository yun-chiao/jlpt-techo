<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <g transform="translate(0 5)">
  <!-- 手帖：墨色 offset 陰影 + 白卡 + 粗框，微傾斜 -->
  <g transform="rotate(-4 32 34)">
    <rect x="15" y="16" width="34" height="38" rx="5" fill="#2B2523"/>
    <rect x="12" y="13" width="34" height="38" rx="5" fill="#FFFFFF" stroke="#2B2523" stroke-width="3.5"/>
    <!-- 內頁橫線 -->
    <path d="M19 29h20M19 36h20M19 43h13" stroke="#2B2523" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>
    <!-- 級別色貼紙 -->
    <circle cx="40" cy="44" r="5" fill="#E63956" stroke="#2B2523" stroke-width="2.5"/>
  </g>
  <!-- 奶油黃紙膠帶 -->
  <rect x="20" y="5" width="22" height="9" rx="1.5" transform="rotate(6 31 9.5)" fill="#FFE5A3" stroke="#2B2523" stroke-width="2.5"/>
  </g>
</svg>