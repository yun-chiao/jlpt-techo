name: Threads 每日自動發文

on:
  schedule:
    # 台北時間 08:03 & 08:18（雙重排程防 GitHub 00:00 UTC 全球尖峰延遲）— 📖 每日五單字
    - cron: '3,18 0 * * *'
    # 台北時間 12:33 & 12:48 — ✏️ 今日一題（N4/N5）
    - cron: '33,48 4 * * *'
    # 台北時間 15:33 & 15:48 — 公布午間題解答 ＋ 🔍 每日文法
    - cron: '33,48 7 * * *'
    # 台北時間 18:33 & 18:48 — 🍂 今日一句
    - cron: '33,48 10 * * *'
    # 台北時間 21:03 & 21:18 — 🌙 睡前一題（N1–N3）
    - cron: '3,18 13 * * *'
    # 台北時間 23:52 & 23:57 — 公布睡前題解答
    - cron: '52,57 15 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: '手動執行項目'
        required: true
        default: 'catchup'
        type: choice
        options:
          - catchup
          - vocab
          - quiz_easy
          - grammar
          - quote
          - quiz_hard
          - reply_quiz_easy
          - reply_quiz_hard
          - all
          - refresh_token
          - insights
      dry_run:
        description: '乾跑模式（不勾選＝直接發到 Threads；勾選＝只印在紀錄裡不發文）'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: jlpt_chiaoban
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 執行 Threads 排程或手動任務
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID || vars.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN || vars.THREADS_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || vars.GEMINI_API_KEY }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          DRY_FLAG=""
          {
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              if [ "${INPUT_DRY_RUN}" = "true" ]; then
                DRY_FLAG="--dry-run"
              elif [ -z "${THREADS_ACCESS_TOKEN:-}" ]; then
                echo "❌ 找不到 THREADS_ACCESS_TOKEN Secret！請確認已新增於 GitHub Settings -> Secrets and variables -> Actions"
                exit 1
              fi
            else
              if [ -z "${THREADS_ACCESS_TOKEN:-}" ]; then
                echo "ℹ️ 尚未設定 THREADS_ACCESS_TOKEN，排程自動切換為 --dry-run 乾跑模式"
                DRY_FLAG="--dry-run"
              fi
            fi
            if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
              case "${INPUT_ACTION}" in
                catchup)
                  python3 scripts/threads/publish.py --catchup ${DRY_FLAG}
                  ;;
                all|vocab|quiz_easy|grammar|quote|quiz_hard)
                  python3 scripts/threads/publish.py --slot "${INPUT_ACTION}" ${DRY_FLAG}
                  ;;
                reply_quiz_easy)
                  python3 scripts/threads/publish.py --reply-quiz quiz_easy ${DRY_FLAG}
                  ;;
                reply_quiz_hard)
                  python3 scripts/threads/publish.py --reply-quiz quiz_hard ${DRY_FLAG}
                  ;;
                refresh_token)
                  python3 scripts/threads/publish.py --refresh-token ${DRY_FLAG}
                  ;;
                insights)
                  python3 scripts/threads/publish.py --insights ${DRY_FLAG}
                  ;;
              esac
            else
              # 無論是 schedule 還是 push，一律執行 --catchup：自動補發當日所有已到點且未發的專欄與解答
              python3 scripts/threads/publish.py --catchup ${DRY_FLAG}
            fi
          } 2>&1 | tee /tmp/publish.log

      - name: 發送失敗時自動開 Issue 告警 (Dead Man's Switch)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let logText = '';
            try {
              logText = fs.readFileSync('/tmp/publish.log', 'utf8').slice(-1500);
            } catch (e) {
              logText = '無法讀取 /tmp/publish.log（可能因缺少 THREADS_ACCESS_TOKEN Secret 而中止）';
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⚠️ Threads 自動發文執行失敗 (${new Date().toISOString().slice(0, 10)})`,
              body: `請檢查 GitHub Actions 執行紀錄：${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n### 錯誤訊息摘要\n\`\`\`text\n${logText}\n\`\`\``
            });
